# max_fails=0 keeps nginx from marking the container "down" and refusing to
# retry it for fail_timeout afterwards. During a deploy the backend is briefly
# unreachable; without this, requests kept arriving at an upstream nginx had
# already written off, and users saw 502s well after it came back.
upstream frontend { server frontend:3000 max_fails=0; }
upstream backend  { server backend:8000  max_fails=0; }

# Identify the real client for rate limiting.
#
# This stack listens on 127.0.0.1 only, so the single reachable path is the
# aaPanel nginx in front, and that edge sets X-Real-IP to the true peer --
# overwriting any client-supplied value. Trust it and pass it through.
#
# X-Forwarded-For must NOT be used for this: nginx *appends* to it, so the
# first entry is whatever the caller sent. Keying the login throttle on it let
# an attacker rotate the header and defeat the limit entirely.
map $http_x_real_ip $trusted_client_ip {
    ""      $remote_addr;     # no edge in front: fall back to the direct peer
    default $http_x_real_ip;  # edge already resolved the client
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Uploads up to this size stay in memory. The default is ~16k, so every
    # attachment was being spooled to a temp file on disk first.
    client_body_buffer_size 1m;

    # `always` so these still apply on error responses, not just 2xx.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # TLS terminates at the aaPanel nginx in front of this one, so HSTS is set
    # there rather than here; setting it on a plain-HTTP listener does nothing.
    server_tokens off;

    # Streaming chat: buffering here would hold the whole SSE response
    # until completion and the UI would look frozen.
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $trusted_client_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        # Fail fast if the backend is mid-restart rather than holding the
        # browser open. Deliberately no proxy_next_upstream retry here: /api/chat
        # bills on every call, so a silently replayed POST could double-charge.
        proxy_connect_timeout 5s;
    }

    location /media/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $trusted_client_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
