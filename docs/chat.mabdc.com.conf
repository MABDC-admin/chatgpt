# aaPanel vhost for chat.mabdc.com -> Teacher AI Platform
# Replaces the previous proxy_pass to 127.0.0.1:18011 (paperless-ai-search).

server {
    listen 80;
    server_name chat.mabdc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/chat.mabdc.com;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name chat.mabdc.com;

    # Let's Encrypt cert (valid to 2026-12-10). The aaPanel copy at
    # /www/server/panel/vhost/cert/chat.mabdc.com/ expired 2026-06-13.
    ssl_certificate     /etc/letsencrypt/live/chat.mabdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.mabdc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    client_max_body_size 500M;

    # Streaming chat. Buffering here would hold the entire SSE response until
    # the model finished, and the UI would sit blank until then.
    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    access_log /www/wwwlogs/chat.mabdc.com.log;
    error_log /www/wwwlogs/chat.mabdc.com.error.log;
}
