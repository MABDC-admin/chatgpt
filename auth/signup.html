<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
        </div>
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-medium hover:bg-purple-700 transition-colors">Request Access</button>
        </form>
        <div class="mt-5 text-sm text-center">
            <p class="text-gray-500">Already have an account? <a href="/auth/login.html" class="text-purple-600 hover:underline font-medium">Sign in</a></p>
        </div>
    </div>
    <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error');
        const btn = document.getElementById('submitBtn');
        errEl.classList.add('hidden');
        const pw = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (pw !== confirm) {
            errEl.textContent = 'Passwords do not match';
            errEl.classList.remove('hidden');
            return;
        }
        if (pw.length < 6) {
            errEl.textContent = 'Password must be at least 6 characters';
            errEl.classList.remove('hidden');
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: pw
                })
            });
            const data = await res.json();
            if (data.ok) {
                window.location.href = '/auth/pending.html';
            } else {
                errEl.textContent = data.error || 'Registration failed';
                errEl.classList.remove('hidden');
            }
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Request Access';
    });
    </script>
</body>
</html>
