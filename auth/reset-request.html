<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Quipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Reset Password</h1>
            <p class="text-sm text-gray-500 mt-1">Enter your email to receive a reset link</p>
        </div>
        <div id="success" class="hidden text-center py-4">
            <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="text-gray-700 font-medium">Check your email</p>
            <p class="text-sm text-gray-500 mt-1">If an account exists with that email, we've sent a password reset link.</p>
        </div>
        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-medium hover:bg-purple-700 transition-colors">Send Reset Link</button>
        </form>
        <div class="mt-5 text-sm text-center">
            <a href="/auth/login.html" class="text-purple-600 hover:underline font-medium">Back to sign in</a>
        </div>
    </div>
    <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error');
        const btn = document.getElementById('submitBtn');
        errEl.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
            const res = await fetch('/api/auth/reset-request', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value })
            });
            const data = await res.json();
            if (data.ok) {
                document.getElementById('resetForm').classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
            } else {
                errEl.textContent = data.error || 'Request failed';
                errEl.classList.remove('hidden');
            }
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
    });
    </script>
</body>
</html>
