<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MABDC Library Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-2">Welcome to MABDC</h1>
        <p class="text-gray-500 text-center mb-8">Select a platform to continue</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="platform-grid">
            <!-- Quipper Card -->
            <a href="/quipper/" id="card-quipper" class="group block bg-white rounded-2xl shadow-sm border-2 border-purple-100 hover:border-purple-500 p-8 transition-all duration-200 hover:shadow-lg">
                <div class="w-16 h-16 bg-purple-100 group-hover:bg-purple-200 rounded-2xl flex items-center justify-center mx-auto mb-5 transition-colors">
                    <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-gray-900 text-center mb-2">Quipper</h2>
                <p class="text-sm text-gray-500 text-center">Curriculum & learning management platform</p>
            </a>

            <!-- Phoenix Card -->
            <a href="/phoenix/" id="card-phoenix" class="group block bg-white rounded-2xl shadow-sm border-2 border-emerald-100 hover:border-emerald-500 p-8 transition-all duration-200 hover:shadow-lg">
                <div class="w-16 h-16 bg-emerald-100 group-hover:bg-emerald-200 rounded-2xl flex items-center justify-center mx-auto mb-5 transition-colors">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>
                </div>
                <h2 class="text-xl font-bold text-gray-900 text-center mb-2">Phoenix</h2>
                <p class="text-sm text-gray-500 text-center">Interactive e-books library for students</p>
            </a>
        </div>

        <div class="mt-8 text-center">
            <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-500 transition-colors">Sign out</button>
        </div>
    </div>

    <script>
    // Pre-fetch Phoenix session so the ebook cookie is set before navigation
    (async () => {
        try {
            await fetch('/api/auth/phoenix-session');
        } catch(e) {}
    })();

    // Hide platform cards the user doesn't have access to
    (async () => {
        try {
            const res = await fetch('/api/auth/my-access');
            if (!res.ok) return;
            const data = await res.json();
            if (!data.ok || !data.data) return;
            const qCard = document.getElementById('card-quipper');
            const pCard = document.getElementById('card-phoenix');
            const grid = document.getElementById('platform-grid');
            let visible = 0;
            if (!data.data.quipper && qCard) { qCard.style.display = 'none'; } else { visible++; }
            if (!data.data.phoenix && pCard) { pCard.style.display = 'none'; } else { visible++; }
            // If only one card visible, center it
            if (visible === 1 && grid) {
                grid.classList.remove('md:grid-cols-2');
                grid.classList.add('md:grid-cols-1', 'max-w-sm', 'mx-auto');
            }
            // If none visible, show message
            if (visible === 0 && grid) {
                grid.innerHTML = '<p class="text-center text-gray-500 col-span-full">No platforms available. Contact your administrator.</p>';
            }
        } catch(e) {}
    })();

    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/auth/login.html';
    }
    </script>
</body>
</html>
