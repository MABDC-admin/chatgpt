<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Quipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border p-8">
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-medium hover:bg-purple-700 transition-colors">Sign In</button>
        </form>
        <div class="mt-5 text-sm text-center space-y-2">
            <a href="/auth/reset-request.html" class="text-purple-600 hover:underline">Forgot password?</a>
            <p class="text-gray-500">Don't have an account? <a href="/auth/signup.html" class="text-purple-600 hover:underline font-medium">Sign up</a></p>
        </div>
    </div>
    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error');
        const btn = document.getElementById('submitBtn');
        errEl.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (data.ok) {
                if (data.data && data.data.role === 'admin') {
                    window.location.href = '/auth/admin.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                errEl.textContent = data.error || 'Login failed';
                errEl.classList.remove('hidden');
            }
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Sign In';
    });
    </script>
</body>
</html>
