<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password — Quipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">New Password</h1>
            <p class="text-sm text-gray-500 mt-1">Enter your new password below</p>
        </div>
        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <input type="password" id="password" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm" required minlength="6" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none">
            </div>
            <div id="error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 text-white py-2.5 rounded-lg font-medium hover:bg-purple-700 transition-colors">Update Password</button>
        </form>
    </div>
    <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
        document.getElementById('error').textContent = 'Invalid or missing reset token.';
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('resetForm').querySelector('button').disabled = true;
    }
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error');
        const btn = document.getElementById('submitBtn');
        errEl.classList.add('hidden');
        const pw = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (pw !== confirm) {
            errEl.textContent = 'Passwords do not match';
            errEl.classList.remove('hidden');
            return;
        }
        if (pw.length < 6) {
            errEl.textContent = 'Password must be at least 6 characters';
            errEl.classList.remove('hidden');
            return;
        }
        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
            const res = await fetch('/api/auth/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ token: token, password: pw })
            });
            const data = await res.json();
            if (data.ok) {
                window.location.href = '/auth/login.html?reset=success';
            } else {
                errEl.textContent = data.error || 'Reset failed';
                errEl.classList.remove('hidden');
            }
        } catch (err) {
            errEl.textContent = 'Network error. Please try again.';
            errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Update Password';
    });
    </script>
</body>
</html>
