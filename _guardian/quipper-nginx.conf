# Port 80 serves content directly — Cloudflare Flexible SSL connects via HTTP.
# A 301 redirect here would cause an infinite redirect loop (CF→HTTP→redirect→CF→HTTP...).
server {
    listen 80;
    listen 443 ssl http2;
    server_name quipper.mabdc.com;

    ssl_certificate /etc/letsencrypt/live/quipper.mabdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quipper.mabdc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /www/wwwroot/quipper.mabdc.com;

    # ─── PUBLIC ───────────────────────────────────────────────────

    location /auth/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store" always;
    }

    location /api/auth/ {
        proxy_pass http://127.0.0.1:18900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    location /edu-files/ {
        proxy_pass http://127.0.0.1:9000/education-worksheets/;
        proxy_set_header Host 127.0.0.1:9000;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-version-id;
    }

    location /api/curriculum/ {
        proxy_pass http://127.0.0.1:9000/quipper-curriculum/;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-version-id;
        proxy_hide_header ETag;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/json; charset=utf-8";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ─── PROTECTED ────────────────────────────────────────────────

    location /api/admin/ {
        auth_request /.internal/auth-check;
        error_page 401 = @unauthenticated;
        error_page 403 = @unauthorized;

        proxy_pass http://127.0.0.1:18900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /.internal/auth-check;
        error_page 401 = @unauthenticated;
        error_page 403 = @pending_approval;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ─── AUTH ERROR HANDLERS ──────────────────────────────────────
    # Use https:// explicitly — Cloudflare Flexible SSL connects via HTTP,
    # so $scheme is "http" and relative redirects would drop Secure cookies.

    location @unauthenticated {
        return 302 https://$host/auth/login.html;
    }

    location @unauthorized {
        return 302 https://$host/auth/login.html;
    }

    location @pending_approval {
        return 302 https://$host/auth/pending.html;
    }

    # ─── INTERNAL AUTH SUBREQUEST ─────────────────────────────────

    location = /.internal/auth-check {
        internal;
        proxy_pass http://127.0.0.1:18900/api/auth/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
