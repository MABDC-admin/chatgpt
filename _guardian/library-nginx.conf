server {
    listen 80;
    listen 443 ssl http2;
    server_name library.mabdc.com;

    ssl_certificate /etc/letsencrypt/live/library.mabdc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.mabdc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /www/wwwroot/library.mabdc.com;
    index index.html;

    # ─── Auth check via FastAPI service (generic, no app context) ───
    location = /.internal/auth-check {
        internal;
        proxy_pass http://127.0.0.1:18900/api/auth/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ─── Auth check for Quipper access ──────────────────────────────
    location = /.internal/auth-check-quipper {
        internal;
        proxy_pass http://127.0.0.1:18900/api/auth/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-App quipper;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ─── Auth check for Phoenix access ──────────────────────────────
    location = /.internal/auth-check-phoenix {
        internal;
        proxy_pass http://127.0.0.1:18900/api/auth/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-App phoenix;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ─── Phoenix auth check (auto-logs into ebooks) ─────────────────
    location = /.internal/phoenix-auth {
        internal;
        proxy_pass http://127.0.0.1:18900/api/auth/phoenix-session;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ─── Public: Auth HTML pages ────────────────────────────────────
    location ^~ /auth/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # ─── Public: API auth endpoints (login, signup, reset) ──────────
    location /api/auth/ {
        proxy_pass http://127.0.0.1:18900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Protected: Admin API ───────────────────────────────────────
    location /api/admin/ {
        auth_request /.internal/auth-check;
        error_page 401 = @unauthenticated;
        error_page 403 = @pending_approval;
        proxy_pass http://127.0.0.1:18900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Public: Quipper static assets ──────────────────────────────
    location /quipper/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location /quipper/css/ {
        expires 30d;
        add_header Cache-Control "public" always;
    }

    location /quipper/js/ {
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # ─── Protected: Quipper SPA ─────────────────────────────────────
    location ^~ /quipper/ {
        auth_request /.internal/auth-check-quipper;
        error_page 401 = @unauthenticated;
        error_page 403 = @pending_approval;
        try_files $uri $uri/ /quipper/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;

        # Inject logout button into Quipper pages
        sub_filter '</body>' '<div id="mabdc-logout-btn" style="position:fixed;bottom:20px;right:20px;z-index:99999;background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-family:Inter,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:.85;transition:opacity .2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.85" onclick="fetch(\'/api/auth/logout\',{method:\'POST\'}).then(()=>window.location.href=\'/auth/login.html\')">Sign Out</div></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # ─── Protected: Phoenix reverse proxy ───────────────────────────
    location ^~ /phoenix/ {
        auth_request /.internal/auth-check-phoenix;
        error_page 401 = @unauthenticated;
        error_page 403 = @pending_approval;

        # If upstream returns 302 (no ebook_session), redirect to landing
        # so the JS pre-fetch can set the cookie
        proxy_intercept_errors on;
        error_page 302 = @phoenix_needs_login;

        proxy_pass https://ebooks.mabdc.com/;
        proxy_set_header Host ebooks.mabdc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        proxy_cookie_domain ebooks.mabdc.com library.mabdc.com;

        # Rewrite /logout absolute path in HTML responses
        sub_filter 'href="/logout"' 'href="/phoenix/logout"';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location @phoenix_needs_login {
        return 302 https://library.mabdc.com/;
    }

    # ─── Public: PWA files ──────────────────────────────────────────
    location ~* ^/(manifest\.webmanifest|registerSW\.js|sw\.js|favicon\.ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Public: Images at root level ───────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Public: Quipper curriculum API (MinIO) ─────────────────────
    location /api/curriculum/ {
        proxy_pass http://127.0.0.1:9000/quipper-curriculum/;
        proxy_set_header Host 127.0.0.1:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ─── Public: Quipper edu-files (MinIO) ──────────────────────────
    location /edu-files/ {
        proxy_pass http://127.0.0.1:9000/education-worksheets/;
        proxy_set_header Host 127.0.0.1:9000;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ─── Public: Root-level static assets (old Vite app remnants) ───
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ─── Protected: Landing page + fallback ─────────────────────────
    location / {
        auth_request /.internal/auth-check;
        error_page 401 = @unauthenticated;
        error_page 403 = @pending_approval;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ─── Error handlers ─────────────────────────────────────────────
    location @unauthenticated {
        return 302 https://library.mabdc.com/auth/login.html;
    }

    location @pending_approval {
        return 302 https://library.mabdc.com/;
    }
}
